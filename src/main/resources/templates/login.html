<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-css('Login — HardwareHub')}"></head>
<body>

<div class="login-bg">
    <div class="login-box">
        <div class="login-header text-center">
            <a th:href="@{/}" class="d-inline-block mb-3">
                <img th:src="@{/images/logo.jpg}" alt="Hardware Hub Logo" style="max-height: 140px; width: auto; border-radius: 10px; object-fit: contain;">
            </a>
            <h2>Welcome Back</h2>
            <p style="font-size: 0.88rem; color: #94a3b8; font-weight: 500;">Sign in to HardwareHub Management</p>
        </div>

        <!-- Error Alert -->
        <div th:if="${param.error}" class="alert alert-danger mb-3" style="font-size: 0.82rem; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #f87171;" id="login-error">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            Invalid username or password.
        </div>

        <!-- Logout Success -->
        <div th:if="${param.logout}" class="alert alert-info mb-3" style="font-size: 0.82rem; background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8;" id="login-logout">
            <i class="bi bi-check-circle-fill me-1"></i>
            You have been logged out successfully.
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label font-weight-bold" style="font-size: 0.85rem; color: #cbd5e1;">Username</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: #0f172a; border-color: var(--border-color); color: #94a3b8;"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" style="background: #0f172a; border-color: var(--border-color); color: #ffffff;" id="username" name="username"
                           placeholder="Enter username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label font-weight-bold" style="font-size: 0.85rem; color: #cbd5e1;">Password</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: #0f172a; border-color: var(--border-color); color: #94a3b8;"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" style="background: #0f172a; border-color: var(--border-color); color: #ffffff;" id="password" name="password"
                           placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 shadow-sm" style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border: 1px solid #3b82f6; font-size: 1rem; color: #ffffff; letter-spacing: 0.5px; transition: all 0.2s ease;" id="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary text-center" style="font-size: 0.8rem; color: #94a3b8;">
            <div class="fw-bold mb-1 text-light">Demo Credentials:</div>
            <div><strong>Admin:</strong> admin / admin123</div>
            <div><strong>User:</strong> user / admin123</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
