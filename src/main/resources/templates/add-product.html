<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-css('Add Component — StarTech & Techland')}"></head>
<body style="background-color: var(--bg-main);">

<!-- Navbar & Category Header -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-dark m-0">Add New Component to Catalogue</h4>
                <a th:href="@{/products}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back to Products
                </a>
            </div>

            <!-- Add Product Form Box -->
            <form th:action="@{/products/add}" th:object="${product}" method="post" class="form-startech" id="add-product-form">
                <div class="mb-3">
                    <label for="name" class="form-label">Component Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" id="name"
                           placeholder="e.g. NVIDIA GeForce RTX 5090 24GB GDDR7" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Key Specifications &amp; Features</label>
                    <textarea th:field="*{description}" class="form-control" id="description" rows="3"
                              placeholder="e.g. 24GB GDDR7, DLSS 4, 4K Gaming, PCIe 5.0"></textarea>
                    <div class="form-text text-muted" style="font-size: 0.78rem;">
                        <i class="bi bi-info-circle me-1"></i>Enter bullet details or key hardware specs.
                    </div>
                </div>

                <!-- Price & Stock -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="price" class="form-label">Price (৳ BDT) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light fw-bold" style="font-size: 0.85rem;">৳</span>
                            <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" id="price"
                                   placeholder="239999.00" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="stockQuantity" class="form-label">Stock Quantity <span class="text-danger">*</span></label>
                        <input type="number" min="0" th:field="*{stockQuantity}" class="form-control" id="stockQuantity"
                               placeholder="15" required>
                    </div>
                </div>

                <!-- Category -->
                <div class="mb-4">
                    <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                    <select th:field="*{category.id}" class="form-select" id="category" required>
                        <option value="" disabled selected>Select Category (GPU, CPU, RAM, etc.)</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}">Category</option>
                    </select>
                </div>

                <div class="d-flex gap-2 justify-content-end border-top pt-3">
                    <a th:href="@{/products}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-bold" id="btn-save-product">
                        <i class="bi bi-check-lg me-1"></i>Save Component
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
